services:
  db:
    image: pgvector/pgvector:pg16
    container_name: claimflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: claimflow
      POSTGRES_USER: claimflow
      POSTGRES_PASSWORD: claimflow_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: claimflow_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: claimflow_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data:
  mongo_data: